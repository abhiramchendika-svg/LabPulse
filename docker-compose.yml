# LabPulse: app + Postgres + Redis.
#   docker compose up --build
# then open http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labpulse
      POSTGRES_PASSWORD: labpulse # local only; the cloud setup uses docker-compose.prod.yml
      POSTGRES_DB: labpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # only for local development (npm run dev)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labpulse"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379" # only for local development (npm run dev)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://labpulse:labpulse@postgres:5432/labpulse
      REDIS_URL: redis://redis:6379
      # The address students type, e.g. http://192.168.1.20:8080 (set it in a .env file).
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Set to true only when LabPulse is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # If set, creating an instructor account needs this code (use it whenever the URL is public).
      INSTRUCTOR_SIGNUP_CODE: ${INSTRUCTOR_SIGNUP_CODE:-}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    volumes:
      # Edit exercises without rebuilding: changes apply to the next lab you open.
      - ./exercises:/app/exercises:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
